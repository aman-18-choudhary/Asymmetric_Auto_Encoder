experiment_name: asymmetric_cifar10
seed: 0
device: auto
deterministic: false
data:
  name: cifar10
  root: data
  image_size: 32
  batch_size: 128
  num_workers: 0
  val_fraction: 0.1
  split_seed: 0
model:
  type: asymmetric
  latent_dim: 64
  channels:
  - 32
  - 64
  - 128
