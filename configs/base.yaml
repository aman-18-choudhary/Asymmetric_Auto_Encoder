# Base experiment configuration. Model/optimizer sections are added in later phases.
experiment_name: debug
seed: 0
device: auto            # auto | cpu | cuda | mps
deterministic: false    # true requests deterministic algorithms (may be slower / raise)

data:
  name: cifar10         # cifar10 | mnist (loaders arrive in Phase 2)
  root: data            # relative to the working directory; never committed
  image_size: 32
  batch_size: 128
  num_workers: 0
  val_fraction: 0.1     # 45k/5k split for CIFAR-10
