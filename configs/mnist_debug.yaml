# Fast debugging config: MNIST resized to 32x32, small latent. Not a reported experiment.
experiment_name: baseline_mnist_debug
seed: 0
device: auto
deterministic: false

data:
  name: mnist
  root: data
  image_size: 32
  batch_size: 128
  num_workers: 0
  val_fraction: 0.1
  split_seed: 0

model:
  latent_dim: 32
  channels: [32, 64, 128]

train:
  epochs: 3
  lr: 0.001
