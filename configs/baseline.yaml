# Model A (symmetric conv autoencoder) on CIFAR-10, per the approved blueprint.
# Training protocol is identical across baseline.yaml / baseline_matched.yaml / asymmetric.yaml.
experiment_name: baseline_cifar10
seed: 0
device: auto
deterministic: false

data:
  name: cifar10
  root: data
  image_size: 32
  batch_size: 128
  num_workers: 0
  val_fraction: 0.1
  split_seed: 0

model:
  latent_dim: 64
  channels: [32, 64, 128]

train:
  epochs: 30
  lr: 0.001
  optimizer: adam
  scheduler: cosine
  early_stopping_patience: 0   # fixed budget for a fair comparison
