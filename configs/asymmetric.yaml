# Model B (asymmetric autoencoder) on CIFAR-10. Data/optimizer settings are identical to
# configs/baseline.yaml; only the model section differs (fair-comparison requirement).
experiment_name: asymmetric_cifar10
seed: 0
device: auto
deterministic: false

data:
  name: cifar10
  root: data
  image_size: 32
  batch_size: 128
  num_workers: 0
  val_fraction: 0.1
  split_seed: 0

model:
  type: asymmetric
  latent_dim: 64
  enc_channels: [64, 128, 256, 256]
  dec_channels: [32, 32, 16, 16]
  refine_steps: 0
  multiscale: true
  scale_weights: null      # default 0.25, 0.5, 1.0 (8x8, 16x16, 32x32)
  latent_norm: false

train:
  epochs: 30
  lr: 0.001
